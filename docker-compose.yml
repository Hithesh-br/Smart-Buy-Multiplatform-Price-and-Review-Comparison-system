version: '3.8'

services:
  web:
    build: .
    container_name: smartbuy_web
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017
      - DB_NAME=smartbuy
      - SECRET_KEY=smartbuy_super_secret_key_prod
      - MEESHO_HEADLESS=true
      - SCRAPER_TIMEOUT=45000
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:6.0
    container_name: smartbuy_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
