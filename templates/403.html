<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Denied | SmartBuy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', system-ui, -apple-system, sans-serif;
        }
        .error-card {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 520px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }
        .error-code {
            font-size: 5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ef4444, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 15px;
        }
        .icon-shield {
            font-size: 4rem;
            color: #ef4444;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="error-card">
    <i class="fas fa-user-shield icon-shield"></i>
    <div class="error-code">403</div>
    <h3 class="fw-bold mb-3">Access Denied</h3>
    <p class="text-secondary mb-4">
        You do not have administrative privileges to access this area. The SmartBuy Admin Inbox and Dashboard are reserved exclusively for authorized administrators.
    </p>
    <div class="d-flex justify-content-center gap-3">
        <a href="/" class="btn btn-primary rounded-pill px-4 py-2 fw-semibold">
            <i class="fas fa-home me-2"></i>Return Home
        </a>
        <a href="/admin/login" class="btn btn-outline-light rounded-pill px-4 py-2 fw-semibold">
            <i class="fas fa-lock me-2"></i>Admin Sign In
        </a>
    </div>
</div>

</body>
</html>
