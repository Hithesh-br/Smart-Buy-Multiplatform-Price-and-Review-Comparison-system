<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Sign In | SmartBuy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', system-ui, -apple-system, sans-serif;
            padding: 20px;
        }
        .admin-card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 40px 36px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }
        .admin-badge {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
        }
        .form-control-dark {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 12px;
            padding: 12px 16px;
        }
        .form-control-dark:focus {
            background: rgba(15, 23, 42, 0.9);
            border-color: var(--primary);
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(37, 99, 235, 0.25);
        }
    </style>
</head>
<body>

<div class="admin-card text-center">
    <div class="admin-badge">
        <i class="fas fa-user-shield"></i> ADMINISTRATOR PORTAL
    </div>
    
    <h3 class="fw-bold mb-1 text-white">Smart<span class="text-primary">Buy</span> Admin</h3>
    <p class="text-secondary small mb-4">Sign in to access SmartBuy Admin Inbox & User Analytics</p>

    {% if error %}
    <div class="alert alert-danger border-0 rounded-4 text-start small mb-4" role="alert">
        <i class="fas fa-exclamation-triangle me-2"></i>{{ error }}
    </div>
    {% endif %}

    <form action="/admin/login" method="POST" class="text-start">
        <div class="mb-3">
            <label class="form-label text-secondary small fw-semibold">Admin Email</label>
            <div class="input-group">
                <span class="input-group-text bg-transparent border-secondary text-secondary"><i class="fas fa-envelope"></i></span>
                <input type="email" name="email" class="form-control form-control-dark" placeholder="admin@smartbuy.com" value="{{ email or '' }}" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label text-secondary small fw-semibold">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-transparent border-secondary text-secondary"><i class="fas fa-lock"></i></span>
                <input type="password" name="password" class="form-control form-control-dark" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-semibold py-2">
            <i class="fas fa-sign-in-alt me-2"></i>Sign In to Admin Portal
        </button>
    </form>

    <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 text-center">
        <a href="/" class="text-secondary small text-decoration-none">
            <i class="fas fa-arrow-left me-1"></i>Back to SmartBuy Home
        </a>
    </div>
</div>

</body>
</html>
