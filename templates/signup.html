<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — SmartBuy Multiplatform Price Comparison</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-card {
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
        }
    </style>
</head>
<body class="premium-bg">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-glass sticky-top shadow-sm py-3">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center text-dark" href="/">
            <span class="fs-4 fw-bold">Smart<span style="color:var(--secondary)">-Buy</span></span>
            <i class="fas fa-bolt text-primary ms-1"></i>
        </a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <a href="/about" class="btn btn-outline-secondary btn-sm rounded-pill px-3 fw-semibold"><i class="fas fa-info-circle me-1"></i>About</a>
            <a href="/signin" class="btn btn-outline-primary btn-sm rounded-pill px-3 fw-semibold"><i class="fas fa-lock me-1"></i>Sign In</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="auth-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-2 shadow" style="width:54px; height:54px; font-size:1.4rem;">
                        <i class="fas fa-user-plus"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Create Your Account</h3>
                    <p class="text-muted small mb-0">Join SmartBuy to save search history and submit feedback</p>
                </div>

                <!-- Dynamic Alert Placeholder -->
                <div id="alertContainer">
                    {% if errors %}
                    <div class="alert alert-danger rounded-4 border-0 shadow-sm p-3 mb-4">
                        <ul class="mb-0 ps-3 small fw-semibold">
                            {% for err in errors %}
                            <li>{{ err }}</li>
                            {% endfor %}
                        </ul>
                    </div>
                    {% endif %}
                </div>

                <form id="signupForm" action="/signup" method="POST" novalidate>
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-secondary">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 rounded-start-pill ps-3"><i class="fas fa-user text-muted"></i></span>
                            <input type="text" id="name" name="name" class="form-control border-start-0 rounded-end-pill shadow-none py-2" placeholder="e.g. Hithesh" value="{{ name | default('', true) }}" required autocomplete="name">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small text-secondary">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 rounded-start-pill ps-3"><i class="fas fa-envelope text-muted"></i></span>
                            <input type="email" id="email" name="email" class="form-control border-start-0 rounded-end-pill shadow-none py-2" placeholder="name@example.com" value="{{ email | default('', true) }}" required autocomplete="email">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small text-secondary">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 rounded-start-pill ps-3"><i class="fas fa-lock text-muted"></i></span>
                            <input type="password" id="password" name="password" class="form-control border-start-0 rounded-end-pill shadow-none py-2" placeholder="At least 6 characters" required autocomplete="new-password">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small text-secondary">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 rounded-start-pill ps-3"><i class="fas fa-shield-alt text-muted"></i></span>
                            <input type="password" id="confirm_password" name="confirm_password" class="form-control border-start-0 rounded-end-pill shadow-none py-2" placeholder="Re-enter password" required autocomplete="new-password">
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="btn btn-primary w-100 rounded-pill py-2.5 fw-bold shadow-sm mb-3">
                        <i class="fas fa-user-check me-2"></i>Create Account
                    </button>

                    <p class="text-center small text-muted mb-0">
                        Already have an account? <a href="/signin" class="fw-bold text-primary text-decoration-none">Sign In here</a>
                    </p>
                </form>
            </div>

        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('signupForm');
    const alertContainer = document.getElementById('alertContainer');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(message, type = 'danger') {
        alertContainer.innerHTML = `
            <div class="alert alert-${type} rounded-4 border-0 shadow-sm p-3 mb-4 alert-dismissible fade show" role="alert">
                <div class="d-flex align-items-center gap-2">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'} fs-5"></i>
                    <span class="fw-semibold small">${message}</span>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        `;
    }

    function clearAlert() {
        alertContainer.innerHTML = '';
    }

    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        clearAlert();

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirm_password = document.getElementById('confirm_password').value;

        // Frontend Validations
        if (!name) {
            showAlert('Please enter valid account details', 'danger');
            return;
        }
        if (!email || !email.includes('@') || !email.includes('.')) {
            showAlert('Please enter valid account details', 'danger');
            return;
        }
        if (password.length < 6) {
            showAlert('Password must be at least 6 characters long.', 'danger');
            return;
        }
        if (password !== confirm_password) {
            showAlert('Passwords do not match.', 'danger');
            return;
        }

        // Loading state
        const originalBtnHtml = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Creating Account...';

        try {
            const response = await fetch('/api/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    name: name,
                    email: email,
                    password: password,
                    confirm_password: confirm_password
                })
            });

            const data = await response.json().catch(() => ({ success: false, message: 'Unable to create account' }));

            if (response.ok && data.success) {
                showAlert(data.message || 'Account created successfully', 'success');
                setTimeout(() => {
                    window.location.href = '/signin';
                }, 1000);
            } else {
                showAlert(data.message || 'Unable to create account', 'danger');
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnHtml;
            }
        } catch (err) {
            console.error('Signup fetch error:', err);
            showAlert('Unable to create account', 'danger');
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalBtnHtml;
        }
    });
});
</script>

</body>
</html>
