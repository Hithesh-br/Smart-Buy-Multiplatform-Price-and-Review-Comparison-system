<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — SmartBuy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-card {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 24px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
        }
        .otp-input-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 20px 0;
        }
        .otp-box {
            width: 48px;
            height: 54px;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            transition: all 0.2s ease-in-out;
        }
        .otp-box:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
            outline: none;
        }
        .otp-box.filled {
            border-color: #6366f1;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="premium-bg">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-glass sticky-top shadow-sm py-3">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center text-dark" href="/">
            <span class="fs-4 fw-bold">Smart<span style="color:var(--secondary)">-Buy</span></span>
            <i class="fas fa-bolt text-primary ms-1"></i>
        </a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <a href="/signin" class="btn btn-outline-primary btn-sm rounded-pill px-3 fw-semibold"><i class="fas fa-lock me-1"></i>Sign In</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="auth-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="bg-warning text-dark rounded-circle d-inline-flex align-items-center justify-content-center mb-2 shadow" style="width:54px; height:54px; font-size:1.4rem;">
                        <i class="fas fa-key"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Forgot Password</h3>
                    <p class="text-muted small mb-0">Enter your registered email address to receive a 6-digit OTP code.</p>
                </div>

                <!-- Alert Placeholder -->
                <div id="alertContainer">
                    {% if error %}
                    <div class="alert alert-danger rounded-4 border-0 shadow-sm p-3 mb-4 text-center fw-semibold">
                        <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
                    </div>
                    {% endif %}
                    {% if message %}
                    <div class="alert alert-success rounded-4 border-0 shadow-sm p-3 mb-4 text-center fw-semibold">
                        <i class="fas fa-check-circle me-2"></i>{{ message }}
                    </div>
                    {% endif %}
                </div>

                <!-- STEP 1: Enter Registered Email -->
                <div id="emailStep">
                    <form id="sendOtpForm">
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-secondary">Registered Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 rounded-start-pill ps-3"><i class="fas fa-envelope text-muted"></i></span>
                                <input type="email" id="email" name="email" class="form-control border-start-0 rounded-end-pill shadow-none py-2" placeholder="name@example.com" value="{{ email | default('', true) }}" required autocomplete="email">
                            </div>
                        </div>

                        <button type="submit" id="sendOtpBtn" class="btn btn-primary w-100 rounded-pill py-2.5 fw-bold shadow-sm mb-3">
                            <i class="fas fa-paper-plane me-2"></i>Send Verification OTP
                        </button>
                    </form>
                </div>

                <!-- STEP 2: Enter 6-Digit OTP (Hidden by default unless step=2) -->
                <div id="otpStep" class="{% if step != 2 %}d-none{% endif %}">
                    <div class="p-3 bg-light rounded-4 border mb-4 text-center">
                        <span class="small text-muted d-block mb-1">We sent a 6-digit verification code to:</span>
                        <strong id="sentEmailDisplay" class="text-dark">{{ email | default('', true) }}</strong>
                    </div>

                    <form id="verifyOtpForm">
                        <div class="mb-3 text-center">
                            <label class="form-label fw-bold small text-secondary">Enter 6-Digit OTP</label>
                            <div class="otp-input-container">
                                <input type="text" maxlength="1" class="form-control otp-box" id="otp1" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
                                <input type="text" maxlength="1" class="form-control otp-box" id="otp2" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
                                <input type="text" maxlength="1" class="form-control otp-box" id="otp3" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
                                <input type="text" maxlength="1" class="form-control otp-box" id="otp4" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
                                <input type="text" maxlength="1" class="form-control otp-box" id="otp5" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
                                <input type="text" maxlength="1" class="form-control otp-box" id="otp6" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
                            </div>
                            <div class="d-flex justify-content-between align-items-center px-2">
                                <span id="expiryTimer" class="small text-muted fw-semibold">OTP valid for 10:00</span>
                                <button type="button" id="resendOtpBtn" class="btn btn-link btn-sm text-primary text-decoration-none fw-semibold p-0" disabled>Resend OTP</button>
                            </div>
                        </div>

                        <button type="submit" id="verifyOtpBtn" class="btn btn-success w-100 rounded-pill py-2.5 fw-bold shadow-sm mb-3">
                            <i class="fas fa-check-circle me-2"></i>Verify OTP & Continue
                        </button>
                    </form>
                </div>

                <div class="text-center pt-2 border-top">
                    <a href="/signin" class="small text-secondary text-decoration-none fw-semibold"><i class="fas fa-arrow-left me-1"></i>Back to Sign In</a>
                </div>

            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const emailStep = document.getElementById('emailStep');
    const otpStep = document.getElementById('otpStep');
    const sendOtpForm = document.getElementById('sendOtpForm');
    const verifyOtpForm = document.getElementById('verifyOtpForm');
    const emailInput = document.getElementById('email');
    const sendOtpBtn = document.getElementById('sendOtpBtn');
    const verifyOtpBtn = document.getElementById('verifyOtpBtn');
    const resendOtpBtn = document.getElementById('resendOtpBtn');
    const alertContainer = document.getElementById('alertContainer');
    const sentEmailDisplay = document.getElementById('sentEmailDisplay');
    const expiryTimer = document.getElementById('expiryTimer');

    const otpBoxes = [
        document.getElementById('otp1'),
        document.getElementById('otp2'),
        document.getElementById('otp3'),
        document.getElementById('otp4'),
        document.getElementById('otp5'),
        document.getElementById('otp6')
    ];

    let timerInterval = null;

    function showAlert(message, type = 'danger') {
        alertContainer.innerHTML = `
            <div class="alert alert-${type} rounded-4 border-0 shadow-sm p-3 mb-4 alert-dismissible fade show" role="alert">
                <div class="d-flex align-items-center gap-2">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'} fs-5"></i>
                    <span class="fw-semibold small">${message}</span>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        `;
    }

    function clearAlert() {
        alertContainer.innerHTML = '';
    }

    otpBoxes.forEach((box, index) => {
        box.addEventListener('input', (e) => {
            if (e.target.value) {
                box.classList.add('filled');
                if (index < otpBoxes.length - 1) otpBoxes[index + 1].focus();
            } else {
                box.classList.remove('filled');
            }
        });

        box.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !box.value && index > 0) {
                otpBoxes[index - 1].focus();
            }
        });

        box.addEventListener('paste', (e) => {
            e.preventDefault();
            const pastedData = (e.clipboardData || window.clipboardData).getData('text').trim();
            if (/^\d{6}$/.test(pastedData)) {
                pastedData.split('').forEach((char, idx) => {
                    if (otpBoxes[idx]) {
                        otpBoxes[idx].value = char;
                        otpBoxes[idx].classList.add('filled');
                    }
                });
                otpBoxes[5].focus();
            }
        });
    });

    function getCombinedOtp() {
        return otpBoxes.map(b => b.value.trim()).join('');
    }

    function start10MinTimer() {
        let seconds = 600;
        if (timerInterval) clearInterval(timerInterval);

        timerInterval = setInterval(() => {
            seconds--;
            if (seconds <= 0) {
                clearInterval(timerInterval);
                expiryTimer.textContent = 'OTP Expired';
                expiryTimer.className = 'small text-danger fw-bold';
                resendOtpBtn.disabled = false;
            } else {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                expiryTimer.textContent = `OTP valid for ${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }
        }, 1000);
    }

    sendOtpForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        clearAlert();

        const email = emailInput.value.trim();
        if (!email || !email.includes('@') || !email.includes('.')) {
            showAlert('Please enter a valid registered email address.', 'danger');
            return;
        }

        sendOtpBtn.disabled = true;
        sendOtpBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Sending OTP...';

        try {
            const resp = await fetch('/send-reset-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ email })
            });

            const data = await resp.json();

            if (resp.ok && data.success) {
                showAlert(data.message || 'OTP sent to your email address.', 'success');
                sentEmailDisplay.textContent = email;
                emailStep.classList.add('d-none');
                otpStep.classList.remove('d-none');
                otpBoxes[0].focus();
                start10MinTimer();
            } else {
                showAlert(data.message || 'Failed to send verification OTP.', 'danger');
                sendOtpBtn.disabled = false;
                sendOtpBtn.innerHTML = '<i class="fas fa-paper-plane me-2"></i>Send Verification OTP';
            }
        } catch (err) {
            console.error(err);
            showAlert('Network error. Unable to send OTP.', 'danger');
            sendOtpBtn.disabled = false;
            sendOtpBtn.innerHTML = '<i class="fas fa-paper-plane me-2"></i>Send Verification OTP';
        }
    });

    resendOtpBtn.addEventListener('click', async function () {
        clearAlert();
        const email = emailInput.value.trim();
        resendOtpBtn.disabled = true;

        try {
            const resp = await fetch('/send-reset-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await resp.json();

            if (resp.ok && data.success) {
                showAlert('Fresh OTP code sent to your email address.', 'success');
                otpBoxes.forEach(b => { b.value = ''; b.classList.remove('filled'); });
                start10MinTimer();
            } else {
                showAlert(data.message || 'Resend cooldown active. Please wait.', 'danger');
                resendOtpBtn.disabled = false;
            }
        } catch (err) {
            showAlert('Unable to resend OTP. Check your network.', 'danger');
            resendOtpBtn.disabled = false;
        }
    });

    verifyOtpForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        clearAlert();

        const email = emailInput.value.trim();
        const otpCode = getCombinedOtp();

        if (otpCode.length !== 6) {
            showAlert('Please enter all 6 digits of the OTP code.', 'danger');
            return;
        }

        verifyOtpBtn.disabled = true;
        verifyOtpBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Verifying...';

        try {
            const resp = await fetch('/verify-reset-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ email, otp: otpCode })
            });

            const data = await resp.json();

            if (resp.ok && data.success) {
                showAlert('✓ OTP verified successfully! Redirecting to set new password...', 'success');
                setTimeout(() => {
                    window.location.href = `/reset-password?email=${encodeURIComponent(email)}`;
                }, 800);
            } else {
                showAlert(data.message || 'Invalid OTP. Please try again.', 'danger');
                verifyOtpBtn.disabled = false;
                verifyOtpBtn.innerHTML = '<i class="fas fa-check-circle me-2"></i>Verify OTP & Continue';
            }
        } catch (err) {
            console.error(err);
            showAlert('Verification error occurred. Please try again.', 'danger');
            verifyOtpBtn.disabled = false;
            verifyOtpBtn.innerHTML = '<i class="fas fa-check-circle me-2"></i>Verify OTP & Continue';
        }
    });
});
</script>
</body>
</html>
